       - it only ever unticks a box it ticked itself;

<script type="text/javascript">
(function () {
  'use strict';

  /* Labels for the boxes the rules can touch — debug output only. */
  var LABELS = {
    page1_9:  'Glucose',            page1_13: 'Glucose: Random',   page1_14: 'Glucose: Fasting',
    page1_10: 'HbA1C',              page1_11: 'Creatinine (eGFR)', page1_12: 'Uric Acid',
    page1_15: 'Sodium',             page1_16: 'Potassium',
    page1_17: 'ALT',                page1_18: 'Alk. Phosphatase',  page1_19: 'Bilirubin',
    page1_20: 'Albumin',            page1_21: 'Lipid Assessment',
    page1_22: 'Albumin/Creatinine Ratio (Urine)', page1_23: 'Urinalysis (Chemical)',
    page1_40: 'CBC',                page1_41: 'Prothrombin Time (INR)',
    page1_44: 'Rubella',            page1_45: 'Prenatal: ABO, RhD, Antibody Screen',
    page1_48: 'Vaginal culture',    page1_50: 'Chlamydia',         page1_51: '[text] Chlamydia source',
    page1_52: 'GC',                 page1_53: '[text] GC source',  page1_57: 'Urine culture',
    page1_65: 'Chronic Hepatitis',  page1_66: 'Hep Immune Status / Previous Exposure',
    page1_68: 'Hepatitis B',        page1_69: 'Hepatitis C',
    page1_70: 'Total PSA',          page1_71: 'Free PSA',
    page1_72: 'PSA: Insured',       page1_73: 'PSA: Uninsured',
    page1_74: 'Vitamin D: Insured', page1_75: 'Vitamin D: Uninsured'
  };

  /* Companion rules. Every box in `when` must be ticked by the operator
     (not by this script) for the rule to fire; `add` boxes are then ticked
     unless a box in `unless` is checked. Percentages are the historical
     confidence in 1,802 submissions. */
  var COMPANION_RULES = [
    { when: ['page1_9'],  add: ['page1_13'], unless: ['page1_14'] }, // Glucose -> Random 99%; suppressed by Fasting
    { when: ['page1_13'], add: ['page1_9'] },                        // Random -> Glucose 100%
    { when: ['page1_14'], add: ['page1_9'] },                        // Fasting -> Glucose 100%
    { when: ['page1_50'], add: ['page1_52'] },                       // Chlamydia -> GC 100%
    { when: ['page1_52'], add: ['page1_50'] },                       // GC -> Chlamydia 100%
    { when: ['page1_15'], add: ['page1_16', 'page1_11'] },           // Sodium -> Potassium 100%, Creatinine 82% (operator-kept rule)
    { when: ['page1_16'], add: ['page1_15', 'page1_11'] },           // Potassium -> Sodium 99%, Creatinine 82%
    { when: ['page1_18'], add: ['page1_19', 'page1_17'] },           // Alk Phos -> Bilirubin 98%, ALT 98%
    { when: ['page1_20'], add: ['page1_17'] },                       // Albumin -> ALT 96%
    { when: ['page1_41'], add: ['page1_40'] },                       // INR -> CBC 78% (operator-kept rule)
    { when: ['page1_65'], add: ['page1_66', 'page1_68'] },           // hepatitis serology trio: 97-100% pairwise
    { when: ['page1_66'], add: ['page1_65', 'page1_68'] },
    { when: ['page1_68'], add: ['page1_65', 'page1_66'] },
    { when: ['page1_69'], add: ['page1_65', 'page1_66', 'page1_68'] }, // Hep C -> trio 100% (trio -> Hep C is only 70%: manual)
    { when: ['page1_70'], add: ['page1_71'] },                       // Total PSA <-> Free PSA <-> Insured, 100% (n=20)
    { when: ['page1_70'], add: ['page1_72'], unless: ['page1_73'] },
    { when: ['page1_71'], add: ['page1_70'] },
    { when: ['page1_71'], add: ['page1_72'], unless: ['page1_73'] },
    { when: ['page1_72'], add: ['page1_70', 'page1_71'] }
  ];

  /* Mutually exclusive on the form: ticking one always unticks the other,
     whether the other was auto-set or manual. */
  var ONLY_ONE_PAIRS = [ ['page1_72', 'page1_73'] ];

  /* While Chlamydia + GC are both ticked, a source typed into one specify
     field is mirrored into the other (values were identical in history). */
  var SOURCE_MIRROR = { boxA: 'page1_50', textA: 'page1_51', boxB: 'page1_52', textB: 'page1_53' };

  var ownedBoxes  = {};   // id -> true (checkbox) | string (text): set by us, we may clear it
  var pinnedBoxes = {};   // id -> true: operator touched it, hands off
  var applyingRules = false;

  function field(id) { return document.getElementById(id); }

  function fireChange(el) {
    // Never trigger 'click' - it runs the native default action and would
    // toggle the checkbox straight back off.
    if (window.jQuery) jQuery(el).trigger('change');
    else el.dispatchEvent(new Event('change', { bubbles: true }));
    if (typeof setDirtyFlag === 'function') setDirtyFlag();
  }

  function markAutoSet(el, on) {
    el.classList.toggle('sc-auto-set', on);
    if (on) {
      el.classList.add('sc-flash');
      setTimeout(function () { el.classList.remove('sc-flash'); }, 1600);
    }
  }

  function setCheckbox(id, on) {
    var el = field(id);
    if (!el || el.checked === on) return false;
    applyingRules = true;
    el.checked = on;
    fireChange(el);
    applyingRules = false;
    markAutoSet(el, on);
    return true;
  }

  function setTextField(id, value) {
    var el = field(id);
    if (!el) return false;
    if (value === '') {
      if (!el.classList.contains('sc-auto-set')) return false;
      applyingRules = true; el.value = ''; fireChange(el); applyingRules = false;
      markAutoSet(el, false);
      return true;
    }
    if (el.value.trim()) return false;
    applyingRules = true; el.value = value; fireChange(el); applyingRules = false;
    markAutoSet(el, true);
    return true;
  }

  function isChecked(id) { var el = field(id); return !!(el && el.checked); }

  // Ticked by the operator (or loaded from a saved form) - not by this script.
  function operatorTicked(id) { return isChecked(id) && ownedBoxes[id] !== true; }

  function operatorText(id) {
    var el = field(id);
    return !!(el && el.value.trim() && typeof ownedBoxes[id] !== 'string');
  }

  function computeWanted() {
    var wanted = {};   // id -> true (tick this box) | string (write this text)
    for (var i = 0; i < COMPANION_RULES.length; i++) {
      var rule = COMPANION_RULES[i];
      if (!rule.when.every(operatorTicked)) continue;
      if (rule.unless && rule.unless.some(isChecked)) continue;
      for (var j = 0; j < rule.add.length; j++) wanted[rule.add[j]] = true;
    }
    // specify-source mirroring, only while both tests are ticked
    if (isChecked(SOURCE_MIRROR.boxA) && isChecked(SOURCE_MIRROR.boxB)) {
      var typedA = operatorText(SOURCE_MIRROR.textA);
      var typedB = operatorText(SOURCE_MIRROR.textB);
      if (typedA && !typedB) wanted[SOURCE_MIRROR.textB] = field(SOURCE_MIRROR.textA).value.trim();
      else if (typedB && !typedA) wanted[SOURCE_MIRROR.textA] = field(SOURCE_MIRROR.textB).value.trim();
    }
    return wanted;
  }

  function applyRules() {
    var wanted = computeWanted();

    // clear what we set that is no longer justified (an owned text field
    // whose wanted value changed is cleared here and re-filled below)
    Object.keys(ownedBoxes).forEach(function (id) {
      if (typeof ownedBoxes[id] === 'string') {
        if (typeof wanted[id] === 'string' && wanted[id] === ownedBoxes[id]) return;
        setTextField(id, '');
        delete ownedBoxes[id];
        return;
      }
      if (wanted[id]) return;
      setCheckbox(id, false);
      delete ownedBoxes[id];
    });

    // set what applies now
    Object.keys(wanted).forEach(function (id) {
      if (pinnedBoxes[id] || ownedBoxes[id]) return;
      var el = field(id);
      if (!el) return;
      if (typeof wanted[id] === 'string') {
        if (setTextField(id, wanted[id])) ownedBoxes[id] = wanted[id];
        else pinnedBoxes[id] = true;              // operator had already written something
      } else {
        if (el.checked) { pinnedBoxes[id] = true; return; }   // operator ticked it first
        if (setCheckbox(id, true)) ownedBoxes[id] = true;
      }
    });
  }

  // Ticking either half of an only-one pair force-unticks the other half,
  // manual or auto. The partner stays off because either no rule re-adds it
  // or an `unless` now suppresses it.
  function enforceOnlyOnePairs(changedId) {
    for (var i = 0; i < ONLY_ONE_PAIRS.length; i++) {
      var pair = ONLY_ONE_PAIRS[i];
      var partnerId = changedId === pair[0] ? pair[1] : changedId === pair[1] ? pair[0] : null;
      if (!partnerId || !isChecked(changedId) || !isChecked(partnerId)) continue;
      applyingRules = true;
      var partner = field(partnerId);
      partner.checked = false;
      fireChange(partner);
      applyingRules = false;
      partner.classList.remove('sc-auto-set');
      delete ownedBoxes[partnerId];
      pinnedBoxes[partnerId] = true;   // keep it off until the operator changes it
    }
  }

  function onOperatorChange(el) {
    if (applyingRules || !el.id) return;
    pinnedBoxes[el.id] = true;
    delete ownedBoxes[el.id];
    el.classList.remove('sc-auto-set');
    if (el.type === 'checkbox') enforceOnlyOnePairs(el.id);
    applyRules();
  }

  var mirrorTimer;
  function onSourceInput() {
    clearTimeout(mirrorTimer);
    mirrorTimer = setTimeout(applyRules, 250);
  }

  function init() {
    var pageOne = document.getElementById('page1');
    if (!pageOne) return;

    // A saved form arrives with boxes already checked: those belong to the
    // operator. Pin them so opening an old requisition changes nothing.
    var inputs = pageOne.querySelectorAll('input, textarea');
    Array.prototype.forEach.call(inputs, function (el) {
      if (!el.id) return;
      if ((el.type === 'checkbox' && el.checked) ||
          (el.type !== 'checkbox' && el.value && el.value.trim())) {
        pinnedBoxes[el.id] = true;
      }
      el.addEventListener('change', function () { onOperatorChange(el); });
    });

    var sourceA = field(SOURCE_MIRROR.textA), sourceB = field(SOURCE_MIRROR.textB);
    if (sourceA) sourceA.addEventListener('input', onSourceInput);
    if (sourceB) sourceB.addEventListener('input', onSourceInput);

    window.__lrDebug = function () {
      return COMPANION_RULES.filter(function (rule) {
        return rule.when.every(operatorTicked) && !(rule.unless && rule.unless.some(isChecked));
      }).map(function (rule) {
        return rule.when.map(function (id) { return LABELS[id] || id; }).join(' + ') +
          ' -> ' + rule.add.map(function (id) { return LABELS[id] || id; }).join(', ');
      });
    };
    window.__lrOwned = function () { return Object.keys(ownedBoxes); };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
